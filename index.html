<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Habit Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Daily Habits</h1>
        <div class="habits">
            <div class="habit" data-habit="morning-pages">
                <i class="fas fa-book"></i>
                <span>Morning Pages</span>
                <div class="checkbox"></div>
            </div>
            <div class="habit" data-habit="no-snack">
                <i class="fas fa-ban"></i>
                <span>No Snack</span>
                <div class="checkbox"></div>
            </div>
            <div class="habit" data-habit="playtime">
                <i class="fas fa-child"></i>
                <span>Playtime with Kids</span>
                <div class="checkbox"></div>
            </div>
            <div class="habit" data-habit="reading">
                <i class="fas fa-book-reader"></i>
                <span>Reading</span>
                <div class="checkbox"></div>
            </div>
            <div class="habit" data-habit="walking">
                <i class="fas fa-walking"></i>
                <span>Walking</span>
                <div class="checkbox"></div>
            </div>
        </div>
        <div class="date">
            <span id="current-date"></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
